<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Drainage Inspector</title>
  <meta name="description" content="Kano–Maradi–Dutse railway drainage inspector: walk the line, record what is built.">
  <meta name="theme-color" content="#F6F5F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%23121311'/><rect x='11' y='2' width='2' height='20' fill='%23fff'/><circle cx='12' cy='16' r='4' fill='%23FFD100' stroke='%23121311' stroke-width='1.5'/></svg>">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="ui/app.css?v=20260929_1">
</head>
<body>
  <div id="app">
    <section class="screen" id="scr-walk">
      <header class="pos" id="posHead"></header>
      <div class="lanes-head" id="laneHead"></div>
      <div class="lanes-head hidden" id="cutHead" style="display:flex;justify-content:space-between;gap:8px;padding:14px 12px;font:700 13px/1 var(--f-sans);letter-spacing:0.06em;white-space:nowrap"></div>
      <div class="viewport" id="vp">
        <div id="stripHost" style="position:absolute;inset:0"></div>
        <div id="mapHost" class="hidden" style="position:absolute;inset:0"></div>
        <div id="cutHost" class="hidden scroll" style="position:absolute;inset:0;touch-action:pan-y"></div>
        <div class="seg3">
          <button data-act="mode" data-mode="strip">Strip</button>
          <button data-act="mode" data-mode="map">Map</button>
          <button data-act="mode" data-mode="section">Section</button>
        </div>
        <button class="recentre hidden" id="recentre" data-act="recentre">Back to me</button>
      </div>
      <div class="atyou" id="atyou"></div>
    </section>
    <section class="screen" id="scr-section"></section>
    <section class="screen" id="scr-day"></section>

    <nav class="nav">
      <button data-act="tab" data-tab="walk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2 V22 M5 7 H9 M5 12 H9 M5 17 H9 M15 9.5 H19 M15 14.5 H19"/></svg>Walk</button>
      <button data-act="tab" data-tab="section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6 H21 M3 12 H21 M3 18 H21 M8 4 V8 M15 10 V14 M10 16 V20"/></svg>Section</button>
      <button data-act="tab" data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="1"/><path d="M3.5 10 H20.5 M8 3 V7 M16 3 V7 M8.5 15 L11 17.5 L15.5 12.5"/></svg><span id="navDay">Day</span></button>
    </nav>
    <div id="overlay"></div>
    <div id="toastHost"></div>
  </div>

  <!-- design data, bundled so the app starts with no signal -->
  <script src="data/bundle.js?v=20260915_1"></script>
  <script src="data/section02_bundle.js?v=20260915_1"></script>
  <!-- cloud sync of records (queues offline, sends when there is signal) -->
  <script src="config.js?v=20260915_1"></script>
  <script src="sync.js?v=20260915_1"></script>
  <script src="lib/leaflet.js"></script>

  <script src="ui/model.js?v=20260929_1"></script>
  <script src="ui/icons.js?v=20260929_1"></script>
  <script src="ui/strip.js?v=20260929_1"></script>
  <script src="ui/app.js?v=20260929_1"></script>
  <script src="ui/screens.js?v=20260929_1"></script>
  <script>window.DA.boot();</script>
</body>
</html>
